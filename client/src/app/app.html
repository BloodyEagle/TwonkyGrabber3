<header class="app-header">
    <span class="title">Twonky Grabber</span>
    <span class="conn-chip" [class.on]="storeRef.connected()">
        {{ storeRef.connected() ? 'подключено' : 'нет подключения' }}
    </span>
    <span class="spacer"></span>
    <button class="btn btn-secondary" type="button" (click)="toggleQueue()">
        Очередь
        @if (storeRef.activeCount() > 0) {
            <span class="badge tnum">{{ storeRef.activeCount() }}</span>
        }
    </button>
    <button class="btn btn-secondary" type="button" (click)="openSettings()">Настройки</button>
</header>

<main class="app-main">
    @if (storeRef.settingsOpen()) {
        <app-settings-page />
    } @else {
        <section class="panels">
            <div class="panel">
                <h3 class="panel-title">Подключение</h3>
                <app-connection-form />
            </div>
            <div class="panel">
                <app-scan-panel />
            </div>
        </section>

        <section class="gallery-area">
            <app-gallery-toolbar />
            <app-gallery />
        </section>
    }
</main>

@if (storeRef.queueOpen()) {
    <app-queue-panel />
}

<div class="toasts" aria-live="polite">
    @for (t of toasts.toasts(); track t.id) {
        <div class="toast" [class]="'toast ' + t.kind" (click)="toasts.dismiss(t.id)">
            {{ t.text }}
        </div>
    }
</div>
